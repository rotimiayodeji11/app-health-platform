name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask gunicorn pytest

      - name: Run unit tests
        run: pytest

      - name: Build Docker image
        run: docker build -t sre-app:test .

      - name: Run container
        run: docker run -d -p 5001:5001 --name sre-app-test sre-app:test

      - name: Wait for app
        run: sleep 5

      - name: Test health endpoint
        run: curl --fail http://127.0.0.1:5001/health

      - name: Test readiness endpoint
        run: curl --fail http://127.0.0.1:5001/ready

      - name: Show container logs if failure happens
        if: failure()
        run: docker logs sre-app-test
